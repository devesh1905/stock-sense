services:
  postgres:
    image: postgres:16
    container_name: stocksense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense_password
      POSTGRES_DB: stocksense_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
